[pytest]
testpaths = tests
addopts = -ra --strict-markers --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=80
markers =
    unit: fast, isolated tests of pure functions
    functional: HTTP-level tests through FastAPI TestClient with the AI providers mocked
    frontend: validates the generated HTML/JS the browser receives (needs Node.js)
filterwarnings =
    ignore::SyntaxWarning
    ignore::DeprecationWarning
