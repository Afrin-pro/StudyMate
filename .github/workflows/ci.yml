name: CI/CD
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - uses: actions/setup-node@v4          # needed by tests/frontend (node --check)
        with: { node-version: "24" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app.py tests scripts
      - run: pytest                           # enforces --cov-fail-under=80 from pytest.ini
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/

  deploy:                                      # only after tests pass, only from main
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force "https://Ai-WhizKid:${HF_TOKEN}@huggingface.co/spaces/Ai-WhizKid/StudyMate" HEAD:main

  smoke:                                       # free Spaces rebuild/wake slowly, so this only warns
    needs: deploy
    if: github.ref == 'refs/heads/main' && vars.SPACE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Wait for Space and run smoke test
        env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: python scripts/smoke_test.py
        continue-on-error: true
