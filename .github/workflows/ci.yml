name: CI/CD
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - uses: actions/setup-node@v4          # needed by tests/frontend (node --check)
        with: { node-version: "24" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app.py tests scripts
      - run: pytest                           # enforces --cov-fail-under=80 from pytest.ini
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/

  deploy:                                      # only after tests pass, only from main
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push a clean snapshot to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Deploy the current files as ONE fresh commit. This keeps old history
          # (and any binary file ever committed, e.g. a .zip) out of the Space,
          # which rejects binaries that aren't tracked with Git LFS.
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan hf-deploy
          git rm -r -q --cached --ignore-unmatch '*.zip'
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://Ai-WhizKid:${HF_TOKEN}@huggingface.co/spaces/Ai-WhizKid/StudyMate" hf-deploy:main

  smoke:                                       # waits for the Space to rebuild, then checks it is really up
    needs: deploy
    if: github.ref == 'refs/heads/main' && vars.SPACE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Wait for the Space and run smoke test
        env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: python scripts/smoke_test.py "$SPACE_URL"
