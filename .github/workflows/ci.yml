name: CI/CD
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - uses: actions/setup-node@v4          # tests/frontend uses node --check
        with: { node-version: "20" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app.py tests scripts
      - run: pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/

  deploy:                       # only on main, only if tests passed
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Push to HF Spaces
        run: |
          git remote add space https://Ai-WhizKid:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Ai-WhizKid/StudyMate
          git push space main --force

  smoke:
     needs: [test, deploy]
     if: github.ref == 'refs/heads/main' && vars.SPACE_URL != ''
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Wait for Space to come up
        run: python scripts/smoke_test.py "${{ vars.SPACE_URL }}"
          done
          exit 1
